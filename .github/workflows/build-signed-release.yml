name: Build Signed Release APK

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/AhilyanagarDJs-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/AhilyanagarDJs-release.jks
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify APK signature
        run: |
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             AhilyanagarDJs-v1.8-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: AhilyanagarDJs-v1.8-SIGNED
          path: AhilyanagarDJs-v1.8-release.apk
          if-no-files-found: error
